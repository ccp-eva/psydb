global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    default-server check resolvers docker init-addr libc,none

resolvers docker
    nameserver dns 127.0.0.11:53

frontend mongodb_in
    mode tcp
    bind *:47017
    timeout client 24h
    default_backend mongodb

backend mongodb
    mode tcp
    timeout server 24h
    server mongo1 mongodb:27017

frontend greenmail_api_in
    bind *:8811
    default_backend greenmail_api

backend greenmail_api
    server greenmail1 greenmail:8080

frontend greenmail_smtp_in
    mode tcp
    bind *:3025
    timeout client 5m
    default_backend greenmail_smtp

backend greenmail_smtp
    mode tcp
    timeout server 5m
    server greenmail1 greenmail:3025

frontend greenmail_imap_in
    mode tcp
    bind *:3143
    timeout client 1h
    default_backend greenmail_imap

backend greenmail_imap
    mode tcp
    timeout server 1h
    server greenmail1 greenmail:3143

frontend roundcube_in
    bind *:8822
    default_backend roundcube

backend roundcube
    server roundcube1 roundcube:80

frontend mailhog_smtp_in
    mode tcp
    bind *:1025
    timeout client 5m
    default_backend mailhog_smtp

backend mailhog_smtp
    mode tcp
    timeout server 5m
    server mailhog1 mailhog:1025

frontend mailhog_web_in
    bind *:8833
    timeout client 1h
    default_backend mailhog_web

backend mailhog_web
    timeout server 1h
    server mailhog1 mailhog:8025
