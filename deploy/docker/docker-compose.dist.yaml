# docker-compose -p psydb -f docker-compose.yaml up -d
version: "2"
services:
  mongodb:
    image: "mongo:4.4.24"
    ports:
      - "127.0.0.1:47017:27017"
    volumes:
      - "./psydb-data/mongodb:/data/db"
    networks:
      - "psydb-net"
    restart: "unless-stopped"

  nginx-reverse:
    image: "nginx:1.31.1-alpine"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./psydb-config/nginx:/etc/nginx/conf.d"
      - "./psydb-ssl:/etc/ssl/private"
    networks:
      - "psydb-net"
    # make it accessible from the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - psydb
    restart: "unless-stopped"

  # remove if using an actual mail server
  mailhog:
    image: "mailhog/mailhog"
    ports:
      - "127.0.0.1:1025:1025"
      - "8025:8025"
    networks:
      - "psydb-net"
    # make it accessible from the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "unless-stopped"

  psydb:
    image: "cdxoo/psydb:0.100.11.202605220824"
    ports:
      - "127.0.0.1:8080-8081:8080"
    volumes:
      - "./psydb-config/psydb:/usr/src/app/config"
    networks:
      - "psydb-net"
    depends_on:
      - mongodb
      - mailhog
    restart: "unless-stopped"
    deploy:
      mode: "replicated"
      replicas: 2

networks:
  psydb-net:
    driver: "bridge"

